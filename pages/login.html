<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivago - Conta</title>
    <link rel="stylesheet" href="/CSS/styles_login.css">
    <script src="/JS/script.js" language="JavaScript"></script>

</head>

<body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand" aria-label="Travelly brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <a href="/index.html"><span>Travelly</span></a>
        </div>

        <nav class="nav-links" aria-label="Main navigation">
          <a href="/index.html#explore">Explorar</a>
          <a href="/index.html#offers">Ofertas</a>
          <a href="/pages/packages.html">Pacotes</a>
          <a href="/pages/support.html#about">Sobre Nós</a>
          <a href="/pages/support.html">Suporte</a>
        </nav>

        <div class="nav-actions">
          <a href="/pages/login.html"><button class="btn btn-secondary">Entrar</button></a>
          <a href="/pages/createaccount.html"><button class="btn btn-primary">Criar conta</button></a>
        </div>
      </div>
    </header>

    <div class="login-container">

        <div class="login-form">
            <h1>Logar na conta</h1>
            <form action="" method="post">

                <div class="form-group">
                    <label for="login-username">Usuário:</label>
                    <input type="text" id="login-username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Senha:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>

                <div class="buttons">
                    <button type="submit" class="btn-toggle">Entrar</button>
                    <button type="button" class="btn-toggle" onclick="alternarTelas()">Criar uma conta</button>
                </div>

            </form>
        </div>

        <div class="create-form hidden">
            <h1>Criar conta</h1>
            <form action="" method="post">

                <div class="form-group">
                    <label for="login-username">Usuário:</label>
                    <input type="text" id="login-username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Senha:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="password_retry">Confirmar senha:</label>
                    <input type="password" id="password_retry" name="password_retry" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="buttons">
                    <button type="submit" class="btn-toggle">Criar</button>
                    <button type="button" class="btn-toggle" onclick="alternarTelas()">Login</button>
                </div>


            </form>
        </div>
        
    </div>

</body>
</html>
